*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;background:var(--bg);color:var(--text);font:400 1rem/1.5 "Inter",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
.back{color:var(--muted);font-size:.9rem;text-decoration:none;align-self:center}
.back:hover{color:var(--text)}

.card{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px}
.logo{display:inline-block;background:#fff;border-radius:10px;padding:6px 10px;margin-bottom:22px}
.logo i{display:block;height:30px;aspect-ratio:4.96;background:var(--logo) center/contain no-repeat}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{color:var(--muted);margin:6px 0 22px;font-size:.95rem}

/* Log in / Sign up switch */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.tabs button{padding:9px;border:0;border-radius:9px;background:none;color:var(--muted);font:500 .92rem "Inter",sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font:600 .95rem "Inter",sans-serif;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:#4a4a5e;background:#171722}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.primary:hover:not(:disabled){background:#d4ff77;border-color:#d4ff77}
.social{display:grid;gap:10px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:.82rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Form */
form{display:grid;gap:14px}
label{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.input{position:relative}
input{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text);font:400 .98rem "Inter",sans-serif}
input::placeholder{color:#6d6d80}
input:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,77,.22)}
.input input{padding-right:64px}
.toggle{position:absolute;right:6px;top:6px;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--muted);font:500 .8rem "Inter",sans-serif;cursor:pointer}
.toggle:hover{color:var(--text)}
.hint{color:var(--muted);font-size:.8rem;margin-top:6px}
.row{display:flex;justify-content:flex-end;margin-top:-4px}
.link{border:0;background:none;color:var(--lime);font:500 .85rem "Inter",sans-serif;cursor:pointer;padding:2px}
.link:hover{text-decoration:underline}
.msg{min-height:1.3em;margin-top:14px;font-size:.88rem;color:var(--error)}
.msg.ok{color:var(--lime)}
.notice{margin-bottom:18px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:10px;background:var(--field);color:var(--muted);font-size:.85rem}
.foot{margin-top:18px;color:var(--muted);font-size:.78rem;text-align:center}

/* Signed-in view */
.user{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.user b{display:block}.user span{color:var(--muted);font-size:.88rem;word-break:break-all}
[hidden]{display:none!important}
@media(max-width:420px){.card{padding:26px 20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Log in to continue to your courses.</p>

    <div class="tabs" role="tablist" aria-label="Log in or sign up">
      <button type="button" role="tab" id="tabLogin" aria-selected="true" aria-controls="loginForm">Log in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false" aria-controls="signupForm" tabindex="-1">Sign up</button>
    </div>

    <div class="social">
      <button type="button" class="btn" data-provider="google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <button type="button" class="btn" data-provider="facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Continue with Facebook
      </button>
    </div>

    <div class="or"><span>or use your email</span></div>

    <form id="loginForm" role="tabpanel" aria-labelledby="tabLogin" novalidate>
      <div><label for="liEmail">Email</label><input id="liEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div>
        <label for="liPass">Password</label>
        <div class="input"><input id="liPass" name="password" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="toggle" data-for="liPass" aria-label="Show password">Show</button></div>
      </div>
      <div class="row"><button type="button" class="link" id="forgot">Forgot password?</button></div>
      <button type="submit" class="btn primary">Log in</button>
    </form>

    <form id="signupForm" role="tabpanel" aria-labelledby="tabSignup" novalidate hidden>
      <div><label for="suName">Full name</label><input id="suName" name="name" type="text" autocomplete="name" placeholder="Your name"></div>
      <div><label for="suEmail">Email</label><input id="suEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
      <div>
        <label for="suPass">Password</label>
        <div class="input"><input id="suPass" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="toggle" data-for="suPass" aria-label="Show password">Show</button></div>
        <p class="hint">Use 8 or more characters. A mix of letters and numbers is best.</p>
      </div>
      <button type="submit" class="btn primary">Create account</button>
    </form>

    <p class="msg" id="msg" role="alert" aria-live="polite"></p>
    <p class="foot">Sign-in is handled by Firebase Authentication. This site never sees or stores your password.</p>
  </div>

  <!-- Shown when someone is already signed in -->
  <div id="userView" hidden>
    <h1>You're signed in</h1>
    <div class="user"><div class="avatar" id="avatar" aria-hidden="true"></div><div><b id="uName"></b><span id="uEmail"></span></div></div>
    <a class="btn primary" id="continue" href="index.html" style="text-decoration:none">Continue</a>
    <button type="button" class="btn" id="logout" style="margin-top:10px">Log out</button>
  </div>
</main>

<script>
/* =====================================================================
   SETUP (3 steps) — do this once, then the page works for real:
   1. Firebase console → your project → Project settings → "Your apps" → add a Web app → copy the config values below.
   2. Build → Authentication → Get started → Sign-in method → enable Email/Password and Google
      (Facebook needs a Facebook Developers app: paste its App ID + Secret into Firebase).
   3. Authentication → Settings → Authorized domains → add the domain you publish on (localhost is already allowed).
   Open this page through a web server (e.g. VS Code "Live Server"), not by double-clicking the file.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};
const REDIRECT_TO = "index.html";   // where to go after a successful login
const SDK = "https://www.gstatic.com/firebasejs/10.14.1/";

const $ = id => document.getElementById(id);
let fb = null, working = false;

/* ---------- small helpers ---------- */
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function say(text, ok){ $('msg').textContent = text || ''; $('msg').className = 'msg' + (ok ? ' ok' : ''); }
function notice(text){ $('notice').textContent = text; $('notice').hidden = false; }
function friendly(e){
  const m = {
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/wrong-password': 'Email or password is incorrect.',
    'auth/user-not-found': 'Email or password is incorrect.',
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/email-already-in-use': 'An account with this email already exists. Try logging in.',
    'auth/weak-password': 'Choose a stronger password (8+ characters).',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
    'auth/network-request-failed': 'Network problem. Check your connection and try again.',
    'auth/popup-closed-by-user': 'The sign-in window was closed before finishing.',
    'auth/popup-blocked': 'Your browser blocked the sign-in popup. Allow popups and try again.',
    'auth/account-exists-with-different-credential': 'This email is already registered with a different sign-in method.',
    'auth/operation-not-allowed': 'This sign-in method is not enabled in Firebase yet.',
    'auth/unauthorized-domain': 'This domain is not authorised in Firebase (Authentication → Settings → Authorized domains).'
  };
  return m[e && e.code] || 'Something went wrong. Please try again.';
}
/* Runs one sign-in action: shows a loading state, handles errors, then redirects */
async function run(btn, action){
  if (!fb) return;
  const label = btn.textContent; working = true; say('');
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  if (btn.type === 'submit') btn.textContent = 'Please wait…';
  try { await action(); location.href = REDIRECT_TO; }
  catch (e) { working = false; say(friendly(e)); }
  finally { document.querySelectorAll('.btn').forEach(b => b.disabled = false); btn.textContent = label; }
}

/* ---------- tabs ---------- */
function showTab(which){
  const signup = which === 'signup';
  $('tabLogin').setAttribute('aria-selected', !signup); $('tabLogin').tabIndex = signup ? -1 : 0;
  $('tabSignup').setAttribute('aria-selected', signup); $('tabSignup').tabIndex = signup ? 0 : -1;
  $('loginForm').hidden = signup; $('signupForm').hidden = !signup;
  $('title').textContent = signup ? 'Create your account' : 'Welcome back';
  $('sub').textContent = signup ? 'Join DigiTech Ecosystem to access courses.' : 'Log in to continue to your courses.';
  say(''); history.replaceState(null, '', signup ? '#signup' : '#login');
}
$('tabLogin').onclick = () => showTab('login');
$('tabSignup').onclick = () => showTab('signup');
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ const s = e.key === 'ArrowRight'; showTab(s ? 'signup' : 'login'); $(s ? 'tabSignup' : 'tabLogin').focus(); }
});
showTab(location.hash === '#signup' ? 'signup' : 'login');

/* ---------- show / hide password ---------- */
document.querySelectorAll('.toggle').forEach(b => b.onclick = () => {
  const input = $(b.dataset.for), show = input.type === 'password';
  input.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
  b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
});

/* ---------- actions ---------- */
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const email = $('liEmail').value.trim(), pw = $('liPass').value;
  if (!validEmail(email)) return say('Enter a valid email address.');
  if (!pw) return say('Enter your password.');
  run(e.submitter || e.target.querySelector('[type=submit]'), () => fb.A.signInWithEmailAndPassword(fb.auth, email, pw));
});

$('signupForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('suName').value.trim(), email = $('suEmail').value.trim(), pw = $('suPass').value;
  if (name.length < 2) return say('Enter your full name.');
  if (!validEmail(email)) return say('Enter a valid email address.');
  if (pw.length < 8) return say('Password must be at least 8 characters.');
  run(e.submitter || e.target.querySelector('[type=submit]'), async () => {
    const cred = await fb.A.createUserWithEmailAndPassword(fb.auth, email, pw);
    await fb.A.updateProfile(cred.user, { displayName: name });
    try { await fb.A.sendEmailVerification(cred.user); } catch (_) { /* not critical */ }
  });
});

document.querySelectorAll('[data-provider]').forEach(b => b.onclick = () => {
  const provider = b.dataset.provider === 'google' ? new fb.A.GoogleAuthProvider() : new fb.A.FacebookAuthProvider();
  run(b, () => fb.A.signInWithPopup(fb.auth, provider));
});

$('forgot').onclick = async () => {
  const email = $('liEmail').value.trim();
  if (!validEmail(email)) return say('Type your email in the field above first.');
  try {
    await fb.A.sendPasswordResetEmail(fb.auth, email);
    say('If an account exists for that email, a reset link is on its way.', true);   // same message either way, so nobody can test which emails exist
  } catch (e) { say(friendly(e)); }
};

$('logout').onclick = () => fb.A.signOut(fb.auth);

/* ---------- live auth state (updates instantly when someone signs in or out) ---------- */
function onUser(user){
  if (working) return;
  $('authView').hidden = !!user; $('userView').hidden = !user;
  if (user){
    const name = user.displayName || user.email.split('@')[0];
    $('uName').textContent = name; $('uEmail').textContent = user.email || '';
    $('avatar').textContent = name.charAt(0).toUpperCase(); $('continue').href = REDIRECT_TO;
  }
}

/* ---------- start ---------- */
(async function init(){
  if (!firebaseConfig.apiKey){
    notice('Firebase is not connected yet. Add your project keys in the script at the bottom of login.html. Until then, the sign-in buttons stay disabled.');
    document.querySelectorAll('.btn, .link').forEach(b => b.disabled = true);
    return;
  }
  try {
    const [{ initializeApp }, A] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js')]);
    fb = { A, auth: A.getAuth(initializeApp(firebaseConfig)) };
    A.onAuthStateChanged(fb.auth, onUser);
  } catch (e) {
    notice('Could not load Firebase. Check your internet connection, and open this page through a web server instead of file://.');
  }
})();
</script>
</body>
</html>
